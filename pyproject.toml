[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "katago-pytorch"
version = "0.1.0"
description = "A PyTorch reproduction of KataGo (Wu 2020): self-play Go with global pooling, playout cap randomization and policy target pruning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
katago-train = "scripts.train:main"
katago-gtp = "scripts.gtp:main"

[tool.setuptools.packages.find]
include = ["katago*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
